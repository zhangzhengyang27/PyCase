<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP 与旧渲染层保持一致（Element Plus 仅注入 style 属性，已允许） -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: http://localhost:* http://127.0.0.1:*; worker-src 'self' blob:"
    />
    <title>Python 示例管理器</title>
    <!-- data-theme 默认 dark；主题的提前恢复在 preload（首帧前），此处仅作无 JS 兜底 -->
    <meta name="theme-color" content="#08090a" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
