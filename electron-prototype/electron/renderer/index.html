<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python 示例管理器</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Monaco Editor AMD loader -->
  <script src="../node_modules/monaco-editor/min/vs/loader.js"></script>
  <script>
    require.config({ paths: { vs: "../node_modules/monaco-editor/min/vs" } });
  </script>
</head>
<body>
  <!-- ===== 顶部工具栏（合并导航 + 状态） ===== -->
  <header class="toolbar">
    <div class="toolbar-left">
      <span class="app-icon">🐍</span>
      <span class="app-title">Python 示例管理器</span>
      <span class="badge prototype">原型</span>
    </div>

    <nav class="toolbar-nav" id="toolbar-nav">
      <button class="nav-segment active" data-view="examples">📚 示例库</button>
      <button class="nav-segment" data-view="toolbox">🧰 工具箱</button>
      <!-- 主题 tab（Turtle / Pygame / OpenCV / PIL / 数据可视化）由 app.js 按 THEMES 配置动态生成 -->
    </nav>

    <div class="toolbar-right">
      <button id="btn-theme-toggle" class="btn btn-ghost" title="切换主题 (Cmd+J)">🌙</button>
      <div class="toolbar-divider"></div>
      <span id="sidecar-status" class="status-dot status-connecting" title="sidecar 连接状态"></span>
      <span id="sidecar-status-text">连接中…</span>
      <div class="toolbar-divider"></div>
      <button id="btn-refresh" class="btn btn-ghost" title="重新加载 (Cmd+R)">↻</button>
    </div>
  </header>

  <!-- ===== 主体布局 ===== -->
  <main class="main-layout">
    <!-- 左侧边栏（示例库 + 工具箱共用容器） -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="search-wrapper">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" class="search-input" placeholder="搜索…" />
        </div>
        <div class="filter-tabs" id="filter-tabs">
          <button class="filter-tab active" data-category="all">全部</button>
          <button class="filter-tab" data-category="topics">topics</button>
          <button class="filter-tab" data-category="tools">tools</button>
          <button class="filter-tab" data-category="projects">projects</button>
        </div>
      </div>

      <!-- 示例库视图 -->
      <div class="sidebar-view" id="view-examples">
        <div class="example-tree" id="example-tree">
          <div class="loading-placeholder">加载示例中…</div>
        </div>
      </div>

      <!-- 工具箱视图 -->
      <div class="sidebar-view" id="view-toolbox" style="display:none;">
        <div class="tool-grid" id="tool-grid">
          <div class="loading-placeholder">加载工具中…</div>
        </div>
      </div>
    </aside>

    <!-- 右侧内容区 -->
    <section class="content-area">
      <!-- 工具信息（仅工具箱视图显示） -->
      <div class="tool-info" id="tool-info" style="display:none;">
        <div class="tool-info-header">
          <span class="tool-icon">🧰</span>
          <span class="tool-name" id="tool-name">未选择工具</span>
        </div>
        <div class="tool-description" id="tool-description"></div>
        <div class="tool-tags" id="tool-tags"></div>
      </div>

      <!-- 统一操作栏 -->
      <div class="action-bar">
        <div class="action-bar-left">
          <span class="file-icon" id="action-bar-icon">📄</span>
          <span class="panel-title" id="code-title">未选择示例</span>
        </div>
        <div class="action-bar-right">
          <button id="btn-view-code" class="btn btn-ghost" style="display:none;" title="查看/编辑代码">📝 代码</button>
          <button id="btn-save" class="btn btn-ghost" disabled title="保存 (Cmd+S)">💾 保存</button>
          <button id="btn-stop" class="btn btn-danger" disabled title="停止 (Cmd+.)">■ 停止</button>
          <button id="btn-run" class="btn btn-primary" disabled title="运行 (Cmd+Enter)">▶ 运行</button>
        </div>
      </div>

      <!-- 代码编辑器 -->
      <div class="code-panel">
        <div class="code-viewer" id="code-viewer">
          <div id="monaco-container"></div>
        </div>
      </div>

      <!-- 参数表单（可折叠） -->
      <div class="args-panel" id="args-panel" style="display:none;">
        <div class="args-header" id="args-header">
          <span class="args-toggle-icon">▼</span>
          <span class="args-title">运行参数</span>
          <span class="args-count" id="args-count"></span>
        </div>
        <div class="args-form" id="args-form">
          <!-- 动态生成 -->
        </div>
      </div>

      <!-- 运行输出 -->
      <div class="output-panel">
        <div class="output-header">
          <div class="output-header-left">
            <span class="output-status-dot" id="output-status-dot"></span>
            <span class="panel-title">终端输出</span>
          </div>
          <button id="btn-clear-output" class="btn btn-ghost" title="清空输出">清空</button>
        </div>
        <div class="output-viewer" id="output-viewer">
          <div class="output-placeholder">选择示例后点击「运行」，输出将实时显示在这里</div>
        </div>
      </div>
    </section>

    <!-- ===== 主题全屏视图（Turtle / Pygame / OpenCV / PIL / 数据可视化）=====
         每个主题一个 section，由 app.js 按 THEMES 配置动态生成，结构与类名统一 -->
    <div id="theme-views-host"></div>
  </main>

  <!-- ===== 底部状态栏 ===== -->
  <footer class="status-bar">
    <div class="status-bar-left">
      <span id="status-sidecar" class="status-item">
        <span class="status-dot status-connecting" id="status-sidecar-dot"></span>
        <span id="status-sidecar-text">sidecar 连接中…</span>
      </span>
    </div>
    <div class="status-bar-center">
      <span id="status-count" class="status-item">0 个示例</span>
    </div>
    <div class="status-bar-right">
      <span id="status-run" class="status-item">就绪</span>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
