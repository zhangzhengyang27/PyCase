name: Release

# 发布链（对齐 leaf-library 的成熟做法）：打 v* tag → 三平台矩阵构建 → 上传到 GitHub Releases。
# 本仓库没有签名证书/公证凭据，因此按「无证书发布」的既定姿势走：
#   · CSC_IDENTITY_AUTO_DISCOVERY=false：不让 electron-builder 去钥匙串找证书；
#   · 不配置 notarize：electron-builder 在完全没有 Apple 凭据时只 warn「skipped notarization」；
#     **但凭据只配一半会抛 InvalidConfigurationError**（要配就配全：APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID
#     或 APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER）；
#   · 产物名必须 ASCII 且带 ${arch}：GitHub 上传路径不转义（中文名会 400），双架构同名会互相覆盖。
#
# 发布步骤：改 VERSION → python scripts/sync_version.py → commit → git tag -a v<版本> → git push origin <tag>
# 首次打开的放行说明（未公证）见 docs/release.md。
#
# 门禁前置（2026-10）：本 workflow 先整体复用 ci.yml（workflow_call）——全绿才进构建矩阵。
# v1.0.0 教训：Release #1 在 CI 全红的日子独立出包，4 分半即失败，tag 里还带着
# tag 之后才修复的 Windows 致命缺陷；「tag 只在验收全绿后创建」从口头纪律变成机器强制。

on:
  push:
    tags:
      - 'v*'

# 发布矩阵不取消：三条平台腿互不牵连，失败腿可单独重跑
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # 发布前置：完整 CI 门禁（pytest+mypy+ruff+前端四件套+smoke+双平台打包矩阵）
  ci:
    name: CI 门禁（发布前置）
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Publish (${{ matrix.target }})
    needs: ci
    timeout-minutes: 180
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            target: mac-arm64
            args: --arm64
            assets: 'dist/*.zip dist/*.dmg'
          - os: macos-15-intel # Intel
            target: mac-x64
            args: --x64
            assets: 'dist/*.zip dist/*.dmg'
          - os: windows-latest
            target: win-x64
            args: --x64
            assets: 'dist/*.exe dist/*.zip'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装前端依赖
        working-directory: electron-prototype/electron
        run: npm ci

      # 冻结 sidecar 并冒烟（真启动 / list_examples == 1496）：
      # 冻包按 runner 架构产出（Apple Silicon runner 出 arm64、Intel runner 出 x64）
      - name: 冻结 sidecar + 冒烟
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python scripts/build_sidecar.py --clean --smoke

      - name: 版本一致性校验（VERSION 为唯一来源）
        run: python scripts/sync_version.py --check

      - name: 前端构建
        working-directory: electron-prototype/electron
        run: npm run build

      - name: 出包（macOS）
        if: matrix.target != 'win-x64'
        working-directory: electron-prototype/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac zip dmg ${{ matrix.args }}

      - name: 出包（Windows）
        if: matrix.target == 'win-x64'
        working-directory: electron-prototype/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis zip ${{ matrix.args }}

      # 发布前冒烟：从产物里真跑一次（macOS 解包 zip；Windows 跑 --dir 产物太慢，改为 NSIS 安装后跑）
      # SMOKE_PERF_SCALE：runner 是无 GPU 的软件渲染虚拟机，性能预算放宽 ×6 当粗粒度回归网
      - name: 产物冒烟（macOS）
        if: matrix.target != 'win-x64'
        working-directory: electron-prototype/electron
        env:
          SMOKE_PERF_SCALE: '6'
          SMOKE_RUN_ENV: system
        run: |
          set -euo pipefail
          ZIP=$(ls dist/*.zip | head -1)
          TMP=$(mktemp -d)
          ditto -x -k "$ZIP" "$TMP"
          # 主可执行文件的定位口径见 scripts/find_mac_app_binary.sh（Helper.app 与深度坑都在注释里）
          APP_BIN=$(bash "$GITHUB_WORKSPACE/scripts/find_mac_app_binary.sh" "$TMP")
          SMOKE_TEST=1 "$APP_BIN"
          echo "[release] ${{ matrix.target }} 产物冒烟通过"

      - name: 产物冒烟（Windows：NSIS 静默安装后跑）
        if: matrix.target == 'win-x64'
        shell: pwsh
        working-directory: electron-prototype/electron
        run: |
          $installer = Get-ChildItem dist/*setup*.exe | Select-Object -First 1
          if (-not $installer) { throw '未产出 NSIS 安装包' }
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $progRoot = Join-Path $env:LOCALAPPDATA 'Programs'
          $appExe = @(
            (Join-Path $progRoot 'Python示例管理器\PyCase.exe'),
            (Join-Path $progRoot 'PyCase\PyCase.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $appExe) {
            $appExe = Get-ChildItem $progRoot -Recurse -Filter 'PyCase.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $appExe) { throw "安装后找不到 PyCase.exe（已扫 $progRoot）" }
          Write-Host "[release] 安装后应用: $appExe"
          # 安装器可能自动拉起应用（runAfterFinish）：清掉游离实例，避免与冒烟实例抢 userData
          Get-Process PyCase -ErrorAction SilentlyContinue | Stop-Process -Force
          $env:SMOKE_TEST = '1'
          $env:SMOKE_PERF_SCALE = '6'
          $env:SMOKE_RUN_ENV = 'system'
          # PowerShell 不等待 GUI 程序（& $exe 会立刻返回、$LASTEXITCODE 为空）：
          # Start-Process -Wait -PassThru 才拿得到退出码；stdout 落盘再回放，保住冒烟日志
          $log = Join-Path $env:RUNNER_TEMP 'win-smoke.log'
          $err = Join-Path $env:RUNNER_TEMP 'win-smoke.err.log'
          $p = Start-Process -FilePath $appExe -Wait -PassThru -RedirectStandardOutput $log -RedirectStandardError $err
          if (Test-Path $log) { Get-Content $log -Tail 80 | Write-Host }
          if (Test-Path $err) { Get-Content $err -Tail 40 | Write-Host }
          if ($p.ExitCode -ne 0) { throw "安装后冒烟失败，退出码 $($p.ExitCode)" }
          $uninstaller = Get-ChildItem (Split-Path $appExe) -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ($uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait }
          Write-Host '[release] Windows 安装冒烟通过'

      # 上传到 GitHub Releases（用 runner 自带的 gh + GITHUB_TOKEN；不依赖第三方 action）
      # working-directory 必须指到 electron 工程：assets 的 dist/* glob 相对它解析——
      # v1.0.1 首轮曾缺这一行，glob 在仓库根解析成「no matches found」三平台齐挂
      # （此步骤在 v1.0.0 时点从未真正执行到，属于潜伏首爆）
      - name: 创建/更新 Release 并上传产物
        shell: bash
        working-directory: electron-prototype/electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ls ${{ matrix.assets }}
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes-from-tag
          gh release upload "$TAG" ${{ matrix.assets }} --clobber
          echo "[release] ${{ matrix.target }} 已上传：$TAG"
