name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Release 的发布前置门禁复用本文件（release.yml `uses: ./.github/workflows/ci.yml`）：
  # v1.0.0 教训——release 与 CI 是两条互不感知的链，tag 打在 CI 全红的日子照样出包
  workflow_call:

# 同 ref 重复触发只保留一条：PR 新推送取消旧 run；main push 与 workflow_call
# （Release 门禁）不取消——门禁结论必须完整落档
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 说明：示例运行依赖仓库根 .venv（按 requirements.txt 装齐，含 opencv/pygame 等重包），
# CI 不重建该环境——Python job 只跑不依赖第三方库的单元测试与核心逻辑。

jobs:
  python:
    name: Python 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装开发依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install ruff==0.6.9

      # 与 .pre-commit-config.yaml 的 ruff 版本保持一致；范围含 sidecar（M6-1 起补上）
      - name: ruff 检查
        run: ruff check app scripts tests electron-prototype/sidecar

      # 类型门禁（M6-1）：app/ 与 sidecar 的公共接口类型（渐进注解口径，见 pyproject [tool.mypy]）
      - name: mypy 类型检查
        run: python -m mypy

      # 视觉基线门禁：产品 token 源的对比度组合（A1 起改指 theme.css）
      - name: 对比度门禁
        run: python scripts/check_contrast.py

      - name: 文档引用防漂移
        run: python3 scripts/check_doc_refs.py

      # 派生数据门禁：烘焙事实索引必须与真实源码树一致（改了数据没重跑 bake 即红），
      # 依赖清单必须与「清单 requirements + 烘焙 import 分析」的聚合结果一致
      - name: 派生数据门禁（facts / requirements）
        run: |
          python -m app.facts_cli check
          python -m app.facts_cli requirements --check

      # 版本号单一来源：VERSION 与 package.json / pyproject / app/_version.py 必须一致
      - name: 版本一致性门禁
        run: python scripts/sync_version.py --check

      # 覆盖率门禁（M6-1，审计 C11）：app/ + sidecar 行覆盖 ≥70% 起步
      # 冷启微门禁（G1）在 CI 上放宽到 150ms：runner 共享 CPU + 冷页缓存的整组耗时约为本机 2 倍
      # （实测最小 94.5ms vs 本机 43–46ms），严格预算 50ms 由本机门禁把关，这里只当数量级回归网
      - name: pytest（含覆盖率门禁）
        env:
          PYCASE_COLD_START_BUDGET_MS: '150'
        # 覆盖率参数只活在 CI（pyproject 注释）：pytest-cov 不进共享 .venv
        run: >
          pytest tests/ -q --tb=short
          --cov=app --cov=electron-prototype/sidecar --cov-report=term-missing:skip-covered
          --cov-fail-under=70

  frontend:
    name: 类型检查与前端测试
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # tests/renderer-loader.mjs 用工程自带的 typescript 转译 TS 源码，必须先装依赖
      - name: 安装前端依赖
        working-directory: electron-prototype/electron
        run: npm ci

      - name: 类型检查
        working-directory: electron-prototype/electron
        run: npm run typecheck

      # 工程门禁（M6-1）：ESLint + stylelint（正确性）+ Prettier（格式）
      - name: Lint 与格式门禁
        working-directory: electron-prototype/electron
        run: |
          npm run lint
          npm run format:check

      - name: 多维筛选引擎纯函数测试
        run: node tests/test_filter_engine.mjs

      - name: 渲染层 history/favorites 纯函数测试（TS 转译加载）
        run: node tests/test_renderer_utils.mjs

      - name: 画廊总览分区纯函数测试（TS 转译加载）
        run: node tests/test_overview.mjs

      - name: 筛选芯片纯函数测试（TS 转译加载）
        run: node tests/test_filter_chips.mjs

      - name: 工具箱分组纯函数测试（TS 转译加载）
        run: node tests/test_toolbox_groups.mjs
      - name: 行级差异纯函数测试（TS 转译加载，A6 版本对比）
        run: node tests/test_diff.mjs

      - name: 渲染层 store 状态编排测试（真实 Vue 响应式 + IPC 桩）
        run: node tests/test_store.mjs

      - name: 主题令牌 ↔ 组件类名一致性（审计 P1 回归网：line-hairline 整族漏映射的守卫）
        run: node tests/test_theme_tokens.mjs

      - name: shared/paths 数据根契约（openLog 双模式路径的单一来源）
        run: node tests/test_shared_paths.mjs

      # Vue 组件渲染层：Vitest + jsdom，与 electron.vite.config.ts 共用 @vitejs/plugin-vue
      - name: Vue 组件渲染层测试
        working-directory: electron-prototype/electron
        run: npm test

  # ---------------------------------------------------------------------------
  # Electron 冒烟自测：仅在已验证的 macOS 上运行（SMOKE_TEST 自校验后退出）
  # 链路：sidecar ready → ping → list_examples 非空 → 渲染进程无 console error
  # ---------------------------------------------------------------------------
  electron-smoke:
    name: Electron smoke (macos)
    runs-on: macos-latest
    needs: frontend
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装前端依赖
        working-directory: electron-prototype/electron
        run: npm ci

      # 无显示器的 runner 上用 xvfb 起 Electron（Linux 需要；macOS 保留以复用同一脚本）
      # SMOKE_PERF_SCALE：runner 是无 GPU 的软件渲染虚拟机，绝对耗时是真实机器的 5–15 倍，
      # 性能预算放宽 ×6 只当粗粒度回归网（严格预算由真实机器上的走查把关，见 src/main/index.ts）；
      # SMOKE_RUN_ENV=system：全新 runner 的共享 venv 首次引导要装几十个包（分钟级），切系统
      # Python 跑示例，走查不把时间耗在与输出链路无关的环境引导上（本机走查仍走共享 venv）
      - name: 冒烟自测
        working-directory: electron-prototype/electron
        env:
          SMOKE_PERF_SCALE: '6'
          SMOKE_RUN_ENV: system
        run: npm run smoke

  # ---------------------------------------------------------------------------
  # 打包矩阵（B3-4）：macOS + Windows 各自冻结 sidecar → 真启动冒烟 → electron-builder 出包
  # 冒烟断言：冻结产物能启动、能加载 app 包、能读资源里的 1493 条示例（打包链最易断的三处）
  # 产物断言：安装包/dir 产物真实存在（含 sidecar 二进制与数据目录）
  # mac 额外跑「打包产物自测」：直接启动 .app 内的可执行文件跑同一套走查探针
  # ---------------------------------------------------------------------------
  packaging:
    name: Packaging (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: frontend
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: mac
          - os: windows-latest
            artifact: win
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装前端依赖
        working-directory: electron-prototype/electron
        run: npm ci

      - name: 冻结 sidecar + 冒烟（真启动 / list_examples == 1493）
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python scripts/build_sidecar.py --clean --smoke

      - name: 前端构建
        working-directory: electron-prototype/electron
        run: npm run build

      - name: 出包（dir 目标，跳签名）
        working-directory: electron-prototype/electron
        run: npx electron-builder --dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 产物断言（sidecar 二进制 + 数据目录 + 应用目录）
        shell: bash
        working-directory: electron-prototype/electron
        run: |
          set -euo pipefail
          RES="dist/mac-arm64/Python示例管理器.app/Contents/Resources"
          if [ ! -d "$RES" ]; then RES="dist/mac/Python示例管理器.app/Contents/Resources"; fi
          if [ ! -d "$RES" ]; then RES="dist/win-unpacked/resources"; fi
          test -d "$RES" || { echo "找不到打包资源目录"; ls -R dist | head -40; exit 1; }
          test -f "$RES/requirements.txt"
          test -d "$RES/json_examples" && test -f "$RES/json_examples/facts.json"
          test -d "$RES/topics" && test -d "$RES/tools" && test -d "$RES/projects" && test -d "$RES/examples_assets"
          if [ -f "$RES/sidecar/sidecar.exe" ]; then test -s "$RES/sidecar/sidecar.exe"; else test -s "$RES/sidecar/sidecar"; fi
          echo "打包产物齐全: $RES"

      - name: 打包产物自测（macOS：启动 .app 内的可执行文件跑走查探针）
        if: matrix.os == 'macos-latest'
        working-directory: electron-prototype/electron
        env:
          SMOKE_PERF_SCALE: '6'
          SMOKE_RUN_ENV: system
        run: |
          set -euo pipefail
          # 主可执行文件的定位口径见 scripts/find_mac_app_binary.sh（Helper.app 与深度坑都在注释里）
          APP_BIN=$(bash "$GITHUB_WORKSPACE/scripts/find_mac_app_binary.sh" dist)
          SMOKE_TEST=1 "$APP_BIN"

      # 分发形态自测（macOS）：出 zip/dmg 并从产物里真跑一次（mt 的 zip 是主要分发格式）
      - name: 分发产物（zip/dmg）+ 解包自测
        if: matrix.os == 'macos-latest'
        working-directory: electron-prototype/electron
        env:
          SMOKE_PERF_SCALE: '6'
          SMOKE_RUN_ENV: system
        run: |
          set -euo pipefail
          npx electron-builder --mac zip dmg
          ZIP=$(ls dist/*.zip | head -1)
          test -n "$ZIP" || { echo "未产出 zip"; exit 1; }
          TMP=$(mktemp -d)
          ditto -x -k "$ZIP" "$TMP"
          APP_BIN=$(bash "$GITHUB_WORKSPACE/scripts/find_mac_app_binary.sh" "$TMP")
          SMOKE_TEST=1 "$APP_BIN"
          echo "[packaging] zip 解包自测通过: $ZIP"
          DMG=$(ls dist/*.dmg | head -1)
          if [ -n "$DMG" ]; then
            # 挂载点显式指定：dmg 卷名带空格（「Python示例管理器 1.0.0-arm64」），
            # 用 `hdiutil attach | tail -1 | awk '{print $NF}'` 取到的只是一段卷名（本机实测踩过）
            MP=$(mktemp -d)
            hdiutil attach -nobrowse -readonly -mountpoint "$MP" "$DMG" >/dev/null
            DMG_BIN=$(bash "$GITHUB_WORKSPACE/scripts/find_mac_app_binary.sh" "$MP") || { hdiutil detach "$MP" || true; exit 1; }
            SMOKE_TEST=1 "$DMG_BIN" || { hdiutil detach "$MP" || true; exit 1; }
            hdiutil detach "$MP"
            echo "[packaging] dmg 挂载自测通过: $DMG"
          fi

      # Windows 安装冒烟（§8 遗留：本机不可验证 → CI 真装真跑）：
      # NSIS 静默安装 → 跑安装后的 exe 走查探针 → 静默卸载
      # 安装目录名随 productName（中文），不做硬编码假设：先探两个常见位置，再按名递归找
      - name: 安装包（NSIS）+ 安装后启动自测（Windows）
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: electron-prototype/electron
        run: |
          npx electron-builder --win nsis
          $installer = Get-ChildItem dist/*.exe | Select-Object -First 1
          if (-not $installer) { throw '未产出 NSIS 安装包' }
          Write-Host "[packaging] 静默安装 $($installer.FullName)"
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $progRoot = Join-Path $env:LOCALAPPDATA 'Programs'
          $appExe = @(
            (Join-Path $progRoot 'Python示例管理器\PyCase.exe'),
            (Join-Path $progRoot 'PyCase\PyCase.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $appExe) {
            $appExe = Get-ChildItem $progRoot -Recurse -Filter 'PyCase.exe' -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $appExe) { throw "安装后找不到 PyCase.exe（已扫 $progRoot）" }
          Write-Host "[packaging] 安装后应用: $appExe"
          # 安装器可能自动拉起应用（runAfterFinish）：清掉游离实例，避免与冒烟实例抢 userData
          Get-Process PyCase -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "[packaging] 启动安装后的应用跑冒烟"
          $env:SMOKE_TEST = '1'
          $env:SMOKE_PERF_SCALE = '6'
          $env:SMOKE_RUN_ENV = 'system'
          # PowerShell 不等待 GUI 程序（& $exe 会立刻返回、$LASTEXITCODE 为空）：必须
          # Start-Process -Wait -PassThru 才拿得到退出码；stdout 落盘再回放，保住冒烟日志
          $log = Join-Path $env:RUNNER_TEMP 'win-smoke.log'
          $err = Join-Path $env:RUNNER_TEMP 'win-smoke.err.log'
          $p = Start-Process -FilePath $appExe -Wait -PassThru -RedirectStandardOutput $log -RedirectStandardError $err
          if (Test-Path $log) { Get-Content $log -Tail 80 | Write-Host }
          if (Test-Path $err) { Get-Content $err -Tail 40 | Write-Host }
          if ($p.ExitCode -ne 0) { throw "安装后冒烟失败，退出码 $($p.ExitCode)" }
          $uninstaller = Get-ChildItem (Split-Path $appExe) -Filter 'Uninstall*.exe' -ErrorAction SilentlyContinue |
            Select-Object -First 1 -ExpandProperty FullName
          if ($uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait }
          Write-Host '[packaging] Windows 安装冒烟通过'
